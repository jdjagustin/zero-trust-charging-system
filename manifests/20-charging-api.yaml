apiVersion: apps/v1
kind: Deployment
metadata:
  name: charging-api
  namespace: billing-cde
  labels:
    app.kubernetes.io/name: charging-api
    app.kubernetes.io/part-of: zero-trust-charging-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: charging-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: charging-api
        app.kubernetes.io/part-of: zero-trust-charging-system
        tier: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: charging-api
          image: harbor.lab.local/library/charging-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: balance-db
            - name: DB_NAME
              value: billing
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: charging-api-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: charging-api-db-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: charging-api
  namespace: billing-cde
spec:
  selector:
    app.kubernetes.io/name: charging-api
  ports:
    - port: 8080
      targetPort: 8080
